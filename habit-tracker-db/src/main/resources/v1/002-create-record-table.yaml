databaseChangeLog:
  - changeSet:
      id: 002-create-record-table
      author: vladfilyushkin
      changes:
        - createTable:
            tableName: records
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: habit_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_records_habit
                    references: habits(id)
              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false